<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>

    <style>
      .title {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: url(#text-grad);
      }
      .subtitle {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tag {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-particle {
        animation: float 6s ease-in-out infinite alternate;
      }
      .glow-node {
        animation: glow 3s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.15); opacity: 0.6; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-15px); }
      }
      @keyframes glow {
        0% { opacity: 0.2; }
        100% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="320" rx="16" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Animated Dynamic Graphical Background Elements (Behind Foreground Text) -->
  <g class="pulse-circle" style="transform-origin: 1000px 100px;">
    <circle cx="1000" cy="100" r="160" fill="url(#accent-grad)" filter="blur(40px)"/>
  </g>
  <g class="pulse-circle" style="transform-origin: 150px 220px; animation-delay: -2s;">
    <circle cx="150" cy="220" r="120" fill="url(#accent-grad)" filter="blur(30px)"/>
  </g>

  <!-- Decorative Network Nodes and Grid Lines -->
  <path d="M 100 260 L 300 200 L 500 270 L 700 220 L 900 260 L 1100 180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M 200 80 L 400 140 L 650 60 L 850 120 L 1050 50" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="300" cy="200" r="4" fill="#38bdf8" class="glow-node"/>
  <circle cx="700" cy="220" r="5" fill="#818cf8" class="glow-node"/>
  <circle cx="900" cy="260" r="4" fill="#c084fc" class="glow-node"/>
  <circle cx="650" cy="60" r="4" fill="#38bdf8" class="glow-node"/>

  <!-- SQL & Serverless Graphic Pill Cards (Positioned clearly around border, non-overlapping) -->
  <g class="float-particle" style="transform-origin: 980px 70px;">
    <rect x="910" y="45" width="160" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="990" y="68" text-anchor="middle" class="tag">⚡ Athena &amp; Trino</text>
  </g>
  
  <g class="float-particle" style="transform-origin: 940px 220px; animation-delay: -3s;">
    <rect x="870" y="200" width="180" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="960" y="223" text-anchor="middle" class="tag">🔍 DuckDB &amp; ClickHouse</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 115)">
    <!-- Badge Pill above Title -->
    <rect x="0" y="-45" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="140" y="-26" text-anchor="middle" class="tag">🚀 Awesome Serverless Queries</text>
    
    <!-- Main Header -->
    <text x="0" y="25" class="title">Serverless Interactive Query Service</text>
    
    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle">Federated SQL Engines, Data Lake Analytics &amp; Embedded Analytical Databases</text>

    <!-- Key Metadata Tags -->
    <g transform="translate(0, 105)">
      <rect x="0" y="0" width="120" height="26" rx="6" fill="#1e293b"/>
      <text x="60" y="17" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">📊 SaaS &amp; OSS</text>

      <rect x="130" y="0" width="140" height="26" rx="6" fill="#1e293b"/>
      <text x="200" y="17" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">⚡ Zero Infra SQL</text>

      <rect x="280" y="0" width="150" height="26" rx="6" fill="#1e293b"/>
      <text x="355" y="17" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12" font-weight="600">🌐 Data Lakehouse</text>
    </g>
  </g>
</svg>
